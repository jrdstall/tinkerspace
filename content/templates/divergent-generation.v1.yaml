id: divergent-generation@1
title: "A-Team Divergent Architecture Generation"
version: 1
category: divergence
advances: works
target_output: deliverable.md

description: >
  Divergent brainstorming of multiple distinct architectural approaches to solve a problem.
  Enforces zero filtering or premature critique to explore unconventional maker mechanisms.

prompt_instructions: >
  You are my personal innovator's assistant and creative brainstorming partner facilitating a divergent ideation pass.
  
  CONTEXT & POSTURE:
  This is a personal tinkering project built for fun and exploration. Think big and have fun with unconventional mechanisms.
  
  STRICT RULE: Do NOT filter, evaluate, rank, or select options during this step.
  Every approach that obeys physics or logic should be included.

  Execute the following:
  1. Brainstorm 4 to 8 distinct architectural concepts or mechanism ideas for the given subject.
  2. For each concept, describe the core mechanism, primary components/materials, key advantage, and potential snag or hazard.
  3. Ensure concepts explore widely different paradigms (e.g., mechanical vs. electronic, passive vs. active, 3D printed vs. off-the-shelf hardware).

deliverable_schema:
  required_sections:
    - "problem_boundary"
    - "candidate_architectures"
    - "paradigm_diversity_summary"
  fields:
    problem_summary: string
    candidate_count: int
    candidate_architectures: list
