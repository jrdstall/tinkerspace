id: association-study@1
title: "Combinatorial Association Study & Adversarial Refutation"
version: 1
category: generation
target_output: deliverable.md

description: >
  Two-stage creativity synthesis over a candidate pair (Abstraction -> 3rd-Domain Transfer)
  followed by an honest reality-check pass.

prompt_instructions: >
  You are my personal innovator's assistant and creative brainstorming partner exploring cross-domain ideas.
  You are given two distinct notes from the corpus: Parent A and Parent B.
  
  CONTEXT & POSTURE:
  This is for personal tinkering and creative discovery. We want to find unexpected connections and mashups that could spark fun new builds.

  Execute the following three steps:
  1. STAGE 1 (MECHANISM ABSTRACTION):
     Extract the core structural or physical mechanism shared between Parent A and Parent B.
     Describe this mechanism in abstract terms that belong to neither domain.

  2. STAGE 2 (THIRD-DOMAIN TRANSFER):
     Apply that abstract mechanism to a completely new idea in a third, unrelated domain.
     Name the new idea and describe a cool, practical application.

  3. ADVERSARIAL REFUTATION (JUDGE PASS):
     Provide an honest reality check. What is the biggest practical challenge, physical snag, or friction in this idea?
     State whether Jared should KEEP (fun/promising to tinker with) or DISCARD this concept.

deliverable_schema:
  required_sections:
    - "abstract_mechanism"
    - "transfer_proposal"
    - "adversarial_judgment"
  fields:
    proposal_title: string
    target_domain: string
    abstract_mechanism: string
    transfer_proposal: string
    strongest_objection: string
    judge_verdict: string # keep | discard
    confidence: float # 0.0 to 1.0
