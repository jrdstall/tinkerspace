id: prototype-and-measure@1
title: "Minimal Prototype Build & Measurement"
version: 1
category: empirical
advances: works
target_output: deliverable.md

description: >
  Build the simplest physical, electronic, or software prototype that proves or disproves the idea.
  Mandates advance kill criteria so negative bench results terminate or redirect effort without moving the goalposts.

prompt_instructions: >
  You are my personal innovator's assistant scoping the quickest decisive prototype.
  
  CONTEXT & POSTURE:
  This is a personal tinkering project. We want the fastest, simplest bench prototype (cardboard mock-up, 3D printed fixture, breadboard, or script spike) to test the core idea in action.
  
  Execute the following:
  1. Define the simplest prototype build to test the core mechanism with minimum effort.
  2. Specify how to test and measure performance using everyday tools or simple instrumentation.
  3. Define the advance kill threshold: what specific observation means the mechanism is a dead end.
  4. Record the observed results, lessons learned, and recommended next step (Advance to CML 5 vs. Pivot/Park).

deliverable_schema:
  required_sections:
    - "prototype_architecture"
    - "measurement_protocol"
    - "advance_kill_threshold"
    - "empirical_results_and_verdict"
  fields:
    prototype_type: string # breadboard | code_spike | physical_mockup | fixture
    kill_threshold_defined: string
    observed_result: string
    empirical_verdict: string # validated | killed | inconclusive
