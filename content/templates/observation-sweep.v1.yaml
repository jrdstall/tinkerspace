id: observation-sweep@1
title: "Observation Clustering & Synthesis Sweep"
version: 1
category: synthesis
target_output: deliverable.md

description: >
  Batch scan of unlinked or dormant observations to identify natural clusters,
  latent patterns, and candidate friction/idea links.

prompt_instructions: >
  You are an expert synthesizer looking across a collection of unlinked observations.
  1. Identify shared mechanisms, physical principles, or recurring patterns among the observations.
  2. Propose 1-3 synthesis themes that connect two or more observations.
  3. Recommend which existing frictions or ideas benefit from these observations.

deliverable_schema:
  required_sections:
    - "clusters"
    - "recommended_links"
  fields:
    sweep_summary: string
    identified_themes: list
    recommended_links: list
