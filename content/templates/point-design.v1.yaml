id: point-design@1
title: "Single Concept Point Design & Costing"
version: 1
category: costing
advances: reach
target_output: deliverable.md

description: >
  Detailed practical and physical breakdown of a chosen concept.
  Costs the build in bill-of-materials parts, weekend hours, build schedule, and budget.

prompt_instructions: >
  You are my personal innovator's assistant mapping out a practical build plan for a chosen design.
  
  CONTEXT & POSTURE:
  This is a personal tinkering project. We want a clear, realistic roadmap of how to assemble it, what off-the-shelf hardware to buy, and what to fabricate.
  
  Execute the following:
  1. Specify the subsystem breakdown and physical/software components of the chosen build.
  2. Produce a preliminary Bill of Materials (BOM) with major components, common maker suppliers (e.g. McMaster, Amazon, Adafruit, AliExpress), and estimated costs.
  3. Estimate realistic build effort broken down by subsystem into weekend hours.
  4. Identify tricky build steps, long-lead parts, and overall estimated budget.

deliverable_schema:
  required_sections:
    - "subsystem_architecture"
    - "bill_of_materials"
    - "effort_and_schedule"
    - "budget_and_risk_summary"
  fields:
    chosen_concept: string
    estimated_bom_cost: string
    estimated_hours: int
    estimated_schedule_weeks: int
    primary_risks: list
