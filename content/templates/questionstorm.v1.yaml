id: questionstorm@1
title: "Warren Berger Question Graph Inquiry"
version: 1
category: inquiry
advances: ["story", "novel"]
target_output: deliverable.md

description: >
  Systematic question deconstruction using Warren Berger's Why -> What If -> How inquiry arc
  to reframe problems, challenge hidden assumptions, and discover unexpected maker angles.

prompt_instructions: >
  You are my personal innovator's assistant facilitating a Warren Berger questionstorming pass.
  
  CONTEXT & POSTURE:
  This is a personal tinkering project for fun and learning. Help me explore the problem space, reframe assumptions, and find exciting new angles.

  Execute the inquiry arc:
  1. WHY Questions: Challenge the root friction or conventional ways of doing things. Why is it currently done this way? Why must it be so complicated?
  2. WHAT IF Questions: Diverge into wild possibilities, constraint removal, and inversions. What if we used unconventional materials? What if the opposite were true?
  3. HOW Questions: Converge into practical maker steps and bench experiments. How might we test this cheaply? How could we hack together a quick proof?
  4. Identify the 3 highest-leverage breakthrough questions for the project.

deliverable_schema:
  required_sections:
    - "why_root_inquiries"
    - "what_if_divergent_reframes"
    - "how_actionable_paths"
    - "high_leverage_priority_questions"
  fields:
    why_questions: list
    what_if_questions: list
    how_questions: list
    top_breakthrough_question: string
