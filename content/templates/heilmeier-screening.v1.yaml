id: heilmeier-screening@1
title: "DARPA Heilmeier Screening Catechism"
version: 1
category: screening
advances: ["story", "reach", "novel"]
target_output: deliverable.md

description: >
  The famous DARPA 8-question screening catechism answered plainly without technical jargon.
  Quick, decisive gate for new engineering and research initiatives.

prompt_instructions: >
  You are an expert technical evaluator answering the DARPA Heilmeier Catechism.
  Answer each question crisply and directly without filler.

  1. What are you trying to do? Articulate your objectives using absolutely no jargon.
  2. How is it done today, and what are the limits of current practice?
  3. What is new in your approach and why do you think it will be successful?
  4. Who cares? If you succeed, what difference will it make?
  5. What are the risks?
  6. How much will it cost?
  7. How long will it take?
  8. What are the mid-term and final "exams" to check for success?

deliverable_schema:
  required_sections:
    - "objectives_no_jargon"
    - "current_practice_and_limits"
    - "new_approach_and_rationale"
    - "impact_and_stakeholders"
    - "risks_and_mitigations"
    - "cost_and_schedule"
    - "success_exams"
  fields:
    jargon_free_summary: string
    novelty_summary: string
    estimated_timeline: string
    screening_verdict: string # pursue | park | let_go
