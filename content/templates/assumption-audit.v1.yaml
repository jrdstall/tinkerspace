id: assumption-audit@1
title: "Discovery-Driven Planning Assumption Audit"
version: 1
category: empirical
advances: ["works", "reach", "story"]
target_output: deliverable.md

description: >
  Systematic assumption checklist following Discovery-Driven Planning principles.
  Catalogs all hidden beliefs that must be true for the build to succeed, along with the cheapest shop test for each.

prompt_instructions: >
  You are my personal innovator's assistant helping stress-test project assumptions before I spend time building.
  
  CONTEXT & POSTURE:
  This is a personal tinkering project. We want to identify the hidden physical or technical gambles early so I don't waste weekends building something doomed by physics or bad assumptions.
  
  Execute the following:
  1. Catalog 5 to 10 underlying assumptions across 3 buckets: Feasibility (can I actually build/hack this?), Usability (will it be satisfying to use?), and Effort/Cost (is the build effort proportionate to the fun?).
  2. Rate each assumption on a 1-5 scale for Impact (if wrong, the build fails) and Uncertainty (how little we know).
  3. Rank assumptions by criticality (Impact × Uncertainty).
  4. For the top 3 critical assumptions, specify the lowest-cost, fastest bench test or sanity check to prove or invalidate them.

deliverable_schema:
  required_sections:
    - "assumption_inventory"
    - "criticality_matrix"
    - "cheapest_test_plan"
  fields:
    assumptions_count: int
    critical_assumptions: list
    cheapest_tests: list
