id: story-draft@1
title: "One-Paragraph Narrative Story & Pitch"
version: 1
category: story
advances: story
target_output: deliverable.md

description: >
  Distills an engineering concept into a compelling 1-paragraph narrative and pitch to share with friends.
  Advances the Story score.

prompt_instructions: >
  You are my personal innovator's assistant helping tell the story of this project.
  
  CONTEXT & POSTURE:
  This is a personal tinkering project. We want a punchy, compelling explanation that captures why this build is cool and worth making, without corporate marketing fluff.
  
  Execute the following:
  1. Draft a concise 1-paragraph story of the project that captures the imagination.
  2. Frame the core friction or curiosity that sparked it, and why building this is satisfying.
  3. Draft 3 quick FAQs addressing practical curiosity (why make it, how hard is it to build, what will it do).
  4. Formulate the "dinner table test": describe the project in two sentences to a curious friend.

deliverable_schema:
  required_sections:
    - "one_paragraph_narrative"
    - "human_friction_and_breakthrough"
    - "skeptics_faq"
    - "dinner_table_pitch"
  fields:
    headline: string
    one_paragraph_story: string
    dinner_table_summary: string
    story_maturity_verdict: string
