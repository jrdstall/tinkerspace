<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tinkerspace{% endblock %}</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --card-bg: #1a2230;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --border-color: #30363d;
            --badge-bg: #21262d;
            --green: #3fb950;
            --orange: #d29922;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .nav-links {
            display: flex;
            gap: 1.5rem;
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
        }
        .nav-links a.active, .nav-links a:hover {
            color: var(--accent);
        }
        main {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 4px;
            background-color: var(--badge-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }
        .badge-green { color: var(--green); border-color: rgba(63,185,80,0.3); }
        .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
        .btn {
            background-color: var(--badge-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.35rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn-primary { background-color: #238636; border-color: rgba(240,246,252,0.1); color: #ffffff; }
        .btn-primary:hover { background-color: #2ea043; border-color: rgba(240,246,252,0.1); color: #ffffff; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding-top: 5rem;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            padding: 1.5rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; gap: 2rem;">
            <a href="/" class="brand">Tinkerspace</a>
            <nav class="nav-links">
                <a href="/" class="active">Explore</a>
                <a href="/workboard">Work Board</a>
                <a href="/triage">Triage <span class="badge" id="triage-badge">{{ inbox_count|default(0) }}</span></a>
                <a href="/intake">Intake <span class="badge" id="intake-badge">{{ drop_count|default(0) }}</span></a>
            </nav>
        </div>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <button class="btn btn-primary" onclick="openCaptureModal()">+ Capture <span class="mono" style="font-size: 0.75rem; opacity: 0.8;">Ctrl+K</span></button>
            <span class="badge badge-green">Service Active</span>
        </div>
    </header>

    <div id="capture-modal" class="modal-overlay" onclick="handleModalOverlayClick(event)">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2 style="font-size: 1.15rem; font-weight: 600;">Zero-Classification Quick Capture</h2>
                <span class="mono" style="font-size: 0.8rem; color: var(--text-muted);">Esc to close</span>
            </div>
            
            <div style="display: flex; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap;">
                <button type="button" class="btn" style="font-size: 0.75rem;" onclick="setPromptStem('I don\'t like')">"I don't like..."</button>
                <button type="button" class="btn" style="font-size: 0.75rem;" onclick="setPromptStem('There has to be a better way to')">"There has to be a better way..."</button>
                <button type="button" class="btn" style="font-size: 0.75rem;" onclick="setPromptStem('I wish')">"I wish..."</button>
            </div>

            <form action="/capture" method="POST">
                <input type="hidden" id="capture-stem" name="stem" value="">
                <textarea id="capture-textarea" name="raw_text" rows="4" placeholder="Type a raw complaint, idea seedling, question, or asset..." style="width: 100%; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); padding: 0.75rem; font-size: 0.95rem; font-family: inherit; margin-bottom: 1rem; resize: vertical;" required></textarea>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                    <button type="button" class="btn" onclick="closeCaptureModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Capture Thought</button>
                </div>
            </form>
        </div>
    </div>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
        function openCaptureModal() {
            const modal = document.getElementById('capture-modal');
            modal.classList.add('active');
            const textarea = document.getElementById('capture-textarea');
            textarea.focus();
        }
        function closeCaptureModal() {
            const modal = document.getElementById('capture-modal');
            modal.classList.remove('active');
            document.getElementById('capture-stem').value = '';
        }
        function handleModalOverlayClick(e) {
            if (e.target.id === 'capture-modal') {
                closeCaptureModal();
            }
        }
        function setPromptStem(stem) {
            document.getElementById('capture-stem').value = stem;
            const textarea = document.getElementById('capture-textarea');
            textarea.value = stem + ' ' + textarea.value.replace(/^I don't like\s*|^There has to be a better way to\s*|^I wish\s*/i, '');
            textarea.focus();
        }
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                openCaptureModal();
            }
            if (e.key === 'Escape') {
                closeCaptureModal();
            }
        });
    </script>
</body>
</html>
